name: Publish feature test image

on:
  push:
    branches: [feat/issue-and-destination-filters]
  workflow_dispatch:

concurrency:
  group: publish-feature-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build, export and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build test image
        run: |
          docker build \
            -t "${REGISTRY}/${IMAGE_NAME}:issue-and-destination-filters" \
            -t "${REGISTRY}/${IMAGE_NAME}:issue-and-destination-filters-${GITHUB_SHA::7}" \
            .

      - name: Export image artifact
        run: |
          docker save "${REGISTRY}/${IMAGE_NAME}:issue-and-destination-filters" \
            | gzip -1 > "/tmp/gitea-mirror-issue-and-destination-filters-${GITHUB_SHA::7}.tar.gz"

      - name: Upload downloadable image artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitea-mirror-issue-and-destination-filters-${{ github.sha }}
          path: /tmp/gitea-mirror-issue-and-destination-filters-*.tar.gz
          retention-days: 30

      - name: Push image to GitHub Container Registry
        run: |
          docker push "${REGISTRY}/${IMAGE_NAME}:issue-and-destination-filters"
          docker push "${REGISTRY}/${IMAGE_NAME}:issue-and-destination-filters-${GITHUB_SHA::7}"
